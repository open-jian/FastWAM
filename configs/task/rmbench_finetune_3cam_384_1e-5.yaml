# @package _global_

defaults:
  - override /data: rmbench
  - override /model: fastwam
  - _self_

batch_size: 2
num_workers: 4

model:
  # The released FastWAM checkpoint is loaded through `resume`; skip redundant
  # video/action backbone initialization and checkpoint mixed-attention blocks
  # to keep fine-tuning memory manageable.
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null
  mot_checkpoint_mixed_attn: true

lr_scheduler_type: cosine
learning_rate: 1.0e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 250
eval_every: 0

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: ./checkpoints/fastwam_release/robotwin_uncond_3cam_384.pt

wandb:
  enabled: false
